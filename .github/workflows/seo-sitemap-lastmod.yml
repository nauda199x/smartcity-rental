name: SEO sitemap lastmod chuẩn

on:
  push:
    branches:
      - main
    paths:
      - "scripts/cap-nhat-sitemap.mjs"
      - ".github/workflows/seo-sitemap-lastmod.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartcity-generated-main
  cancel-in-progress: false

jobs:
  sua-lastmod:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code và toàn bộ lịch sử git
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Chuẩn bị Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sửa lastmod sitemap theo thay đổi thật
        run: |
          set -euo pipefail
          node scripts/cap-nhat-sitemap.mjs
          git diff --check

      - name: Audit cấu trúc sitemap căn hộ
        run: |
          python3 - <<'PY'
          import collections
          import datetime
          import re
          from pathlib import Path
          from zoneinfo import ZoneInfo

          text = Path('sitemap-can-ho.xml').read_text(encoding='utf-8')
          dates = re.findall(r'<lastmod>([^<]+)</lastmod>', text)
          urls = re.findall(r'<loc>([^<]+)</loc>', text)
          if not urls or not dates or len(dates) != len(urls):
              raise SystemExit('Sitemap căn hộ thiếu loc/lastmod hoặc số lượng không khớp')
          if len(urls) != len(set(urls)):
              raise SystemExit('Sitemap căn hộ có URL trùng lặp')

          today = datetime.datetime.now(ZoneInfo('Asia/Ho_Chi_Minh')).date()
          bad_dates = []
          future_dates = []
          bad_urls = []
          missing_files = []

          for url, raw_date in zip(urls, dates):
              if not url.startswith('https://timthuesmartcity.com/can-ho/'):
                  bad_urls.append(url)
              try:
                  d = datetime.date.fromisoformat(raw_date)
              except ValueError:
                  bad_dates.append(raw_date)
                  continue
              if d > today:
                  future_dates.append((url, raw_date))

              rel = url.removeprefix('https://timthuesmartcity.com/').split('?', 1)[0].split('#', 1)[0]
              path = Path(rel + 'index.html') if rel.endswith('/') else Path(rel)
              if not path.exists():
                  missing_files.append(str(path))

          if bad_urls:
              raise SystemExit(f'Có {len(bad_urls)} URL ngoài namespace /can-ho/')
          if bad_dates:
              raise SystemExit(f'Có lastmod sai định dạng: {bad_dates[:5]}')
          if future_dates:
              raise SystemExit(f'Có {len(future_dates)} lastmod ở tương lai')
          if missing_files:
              raise SystemExit(f'Có {len(missing_files)} URL không có file HTML: {missing_files[:5]}')

          counts = collections.Counter(dates)
          print('Tổng URL:', len(urls))
          print('Số ngày lastmod khác nhau hiện tại:', len(counts))
          print('5 ngày phổ biến nhất:', counts.most_common(5))
          print('Audit sitemap căn hộ: OK')
          PY

      - name: Commit sitemap nếu có thay đổi
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap-can-ho.xml
          if git diff --cached --quiet; then
            echo "Sitemap đã đúng, không cần commit."
            exit 0
          fi
          git commit -m "fix(seo): correct sitemap lastmod dates"
          git pull --rebase origin main
          git push origin HEAD:main
