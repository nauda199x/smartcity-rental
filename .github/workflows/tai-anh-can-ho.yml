name: Tải ảnh đại diện căn hộ từ Drive về repo

# Google Drive chặn crawler nên ảnh căn hộ không được Google Images/Zalo đọc
# ổn định. Workflow này tải ảnh về anh-can-ho/ dưới dạng WebP, sinh
# anh-map.json + sitemap-images.xml, rồi sửa trực tiếp ảnh gallery + og:image +
# twitter:image của trang chi tiết. Không sinh lại toàn bộ trang sau đó, để
# không ghi đè các bước SEO/internal-link đã chạy trong workflow cập nhật data.
#
# workflow_run chạy sau workflow cập nhật dữ liệu để tránh hai job cùng sửa
# trang chi tiết song song. Push vào chính workflow/script ảnh dùng để áp dụng
# bản vá ngay khi thay đổi pipeline; commit ảnh sinh ra không khớp các path này
# nên không tạo vòng lặp.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tai-anh-can-ho.yml"
      - "scripts/sinh-danh-sach-anh.py"
      - "scripts/tai-anh-can-ho.py"
      - "scripts/thay-anh-trong-html.py"
  workflow_run:
    workflows:
      - "Cập nhật số căn và tháng trong thẻ SEO"
    types:
      - completed
    branches:
      - main
  schedule:
    # Giữ lịch Chủ nhật như một lớp dự phòng nếu workflow dữ liệu từng bị tắt.
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      gioi_han:
        description: "Chỉ tải N ảnh đầu (0 = tải hết)"
        type: string
        default: "0"

permissions:
  contents: write

# Hai lần chạy song song sẽ đá nhau khi push. Không hủy run cũ giữa lúc đang
# ghi ảnh; run kế tiếp sẽ chờ rồi rà lại idempotent trên main mới nhất.
concurrency:
  group: tai-anh-can-ho-main
  cancel-in-progress: false

jobs:
  tai-anh:
    # workflow_run chỉ chạy khi job cập nhật dữ liệu kết thúc thành công. Push,
    # schedule và workflow_dispatch vẫn chạy bình thường.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Chuẩn bị Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài Pillow và requests
        run: pip install --quiet Pillow requests

      - name: Sinh lại danh sách ảnh từ data.json
        run: |
          set -o pipefail
          python3 scripts/sinh-danh-sach-anh.py 2>&1 | tee ket-qua.txt

      - name: Tải ảnh và chuyển sang WebP
        run: |
          set -o pipefail
          python3 scripts/tai-anh-can-ho.py \
            --gioi-han "${{ inputs.gioi_han || 0 }}" 2>&1 | tee -a ket-qua.txt

      # Script này vừa thay src Drive bằng WebP local, vừa lấy ảnh local đầu
      # tiên trong gallery để đồng bộ og:image/twitter:image cho URL căn.
      - name: Đồng bộ ảnh thật vào HTML và social preview
        run: |
          set -o pipefail
          python3 scripts/thay-anh-trong-html.py 2>&1 | tee -a ket-qua.txt

      # cap-nhat-so-can chạy bước này trước khi ảnh mới được tải. Chạy lại sau
      # khi og:image đã là ảnh local để giữ max-image-preview:large và đồng bộ
      # primaryImageOfPage/thumbnailUrl với đúng ảnh căn. Script idempotent.
      - name: Đồng bộ tín hiệu ảnh cho Google Search
        run: |
          set -o pipefail
          python3 scripts/toi-uu-anh-tim-kiem.py 2>&1 | tee -a ket-qua.txt
          python3 scripts/toi-uu-anh-tim-kiem.py --kiem-tra 2>&1 | tee -a ket-qua.txt

      - name: Ghi kết quả vào phần tóm tắt của lần chạy
        if: always()
        run: |
          {
            echo "## Kết quả tải ảnh căn hộ + social preview"
            echo
            echo '```'
            tail -n 100 ket-qua.txt 2>/dev/null || echo "(script không chạy được)"
            echo '```'
            echo
            echo "Dung lượng thư mục \`anh-can-ho/\`: $(du -sh anh-can-ho 2>/dev/null | cut -f1 || echo 'chưa có')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit và push ảnh
        env:
          NHANH: main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # RÀNG BUỘC: data.json do Apps Script quản lý, workflow này không bao
          # giờ được ghi đè. Script không sửa file đó, nhưng vẫn chặn thêm ở đây.
          git checkout -- data.json || true

          THEO_DOI="anh-can-ho sitemap-images.xml scripts/danh-sach-anh.json"

          if git diff --quiet -- $THEO_DOI '*.html' && \
             [ -z "$(git ls-files --others --exclude-standard -- $THEO_DOI)" ]; then
            echo "Không có ảnh/social preview nào mới — bỏ qua commit."
            exit 0
          fi

          git add -- $THEO_DOI '*.html'
          git commit -m "Đồng bộ ảnh căn hộ và social preview từ Drive"

          for lan in 1 2 3 4; do
            if git pull --rebase origin "$NHANH" && git push origin "HEAD:$NHANH"; then
              echo "Đã push thành công."
              exit 0
            fi
            cho=$((2 ** lan))
            echo "Push thất bại, thử lại sau ${cho}s..."
            sleep "$cho"
          done
          echo "Không push được sau 4 lần thử."
          exit 1
