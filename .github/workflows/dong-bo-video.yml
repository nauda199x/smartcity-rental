name: Đồng bộ video căn hộ

on:
  push:
    branches: [main]
    paths:
      - scripts/dong-bo-video.py
      - .github/workflows/dong-bo-video.yml
  workflow_run:
    workflows: ["Cập nhật số căn và tháng trong thẻ SEO"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: dong-bo-video-main
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Chuẩn bị bộ chuyển đổi video
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Đồng bộ video công khai và tối ưu MP4
        run: python3 -u scripts/dong-bo-video.py
      - name: Lưu video và danh sách phát
        id: save
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- video-can-ho 'can-ho/*/index.html'
          if git diff --cached --quiet; then
            echo "Không có video mới."
            exit 0
          fi
          git commit -m "Đồng bộ video MP4 căn hộ"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          exit 1
      # GITHUB_TOKEN pushes do not automatically build a branch-based Pages site.
      - name: Cập nhật video trên website
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
