name: Đồng bộ video căn hộ

on:
  push:
    branches: [main]
    paths:
      - scripts/dong-bo-video.py
      - scripts/media_can_ho.py
      - .github/workflows/dong-bo-video.yml
  workflow_run:
    workflows: ["Cập nhật số căn và tháng trong thẻ SEO"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# SEO, ảnh và video cùng ghi HTML trên main. Dùng chung hàng đợi để không
# rebase các trang được sinh từ hai snapshot khác nhau; giữ mọi run đang chờ.
concurrency:
  group: smartcity-generated-main
  queue: max
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Chuẩn bị bộ chuyển đổi video
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Kiểm tra cơ chế căn mới chỉ có video
        run: python3 scripts/kiem-tra-can-chi-video.py
      - name: Đồng bộ video công khai và tối ưu MP4
        id: videos
        run: |
          set -euo pipefail
          python3 -u scripts/dong-bo-video.py
          if git diff --quiet -- video-can-ho && \
             [ -z "$(git ls-files --others --exclude-standard -- video-can-ho)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Video và ảnh bìa không đổi; giữ nguyên các trang đã tối ưu SEO."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Regenerate from the new manifest in this same run. Video-only listings
      # must not wait for the next SEO run to receive a cover and detail URL.
      - name: Cập nhật căn chỉ có video trên các trang
        if: steps.videos.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/sinh-trang-can.py
          python3 scripts/sinh-trang-toa.py
          python3 scripts/dung-lai-trang-danh-muc.py
          python3 scripts/dung-lai-trang-chu.py
          python3 scripts/noi-lien-ket-chi-tiet.py
          # Các generator dựng lại cả trang: khôi phục hậu xử lý đã áp dụng
          # trong workflow SEO/ảnh trước khi lưu, kể cả ảnh của căn vừa thêm.
          python3 scripts/cap-nhat-lien-ket-noi-bo.py
          python3 scripts/dong-bo-thuc-the-thuong-hieu.py
          python3 scripts/thay-anh-trong-html.py
          python3 scripts/toi-uu-anh-tim-kiem.py
          python3 scripts/toi-uu-anh-tim-kiem.py --kiem-tra
      - name: Lưu video và danh sách phát
        id: save
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- video-can-ho '*.html' can-ho/danh-sach-trang.json sitemap-can-ho.xml
          if git diff --cached --quiet; then
            echo "Không có video mới."
            exit 0
          fi
          git commit -m "Đồng bộ video MP4 căn hộ"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              # Không lặp lại pull khi Git đang kẹt ở một rebase xung đột.
              # Hàng đợi bảo vệ các workflow; thay đổi thủ công ngoài hàng đợi
              # vẫn phải được giữ lại, không tự chọn một phía/force-push.
              git rebase --abort || true
              echo "::error::Main đã thay đổi ngoài hàng đợi; giữ nguyên dữ liệu trên main và dừng để tránh ghi đè."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          exit 1
      # GITHUB_TOKEN pushes do not automatically build a branch-based Pages site.
      - name: Cập nhật video trên website
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
