name: Cập nhật số căn và tháng trong thẻ SEO

# Số căn nằm trong <title>/og:title/meta description và tháng nằm trong thẻ
# SEO của trang chủ. dong-bo-can.js chạy trong trình duyệt nên không sửa được
# những chỗ đó, dẫn tới việc Google hiển thị con số cũ. Workflow này sửa
# thẳng vào file HTML, rồi cập nhật <lastmod> trong sitemap.xml cho khớp.

on:
  push:
    branches:
      - main
    paths:
      - "data.json"
      - "scripts/sinh-trang-can.py"
      - "scripts/dung-lai-trang-chu.py"
      - "scripts/dung-lai-trang-danh-muc.py"
      - "scripts/noi-lien-ket-chi-tiet.py"
      - ".github/workflows/cap-nhat-so-can.yml"
  schedule:
    # Ba lần một ngày. Giờ Việt Nam là UTC+7, nên 01/09/17 giờ UTC tương ứng
    # 08:00, 16:00 và 00:00 (lần cuối rơi sang ngày hôm sau theo giờ Việt Nam).
    # Giá sàn và số căn đổi theo từng đợt chủ nhà báo trong ngày; chạy một lần
    # lúc rạng sáng như trước làm thẻ SEO lệch suốt cả ngày làm việc.
    - cron: "0 1,9,17 * * *"
  workflow_dispatch:
    inputs:
      chi_thu:
        description: "Chỉ xem trước, không commit gì"
        type: boolean
        default: false

permissions:
  contents: write

# Không để hai lần chạy chồng nhau — sẽ đá nhau khi push.
concurrency:
  group: cap-nhat-so-can
  cancel-in-progress: false

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code
        uses: actions/checkout@v4
        with:
          # cap-nhat-sitemap.mjs hỏi git ngày commit gần nhất của data.json và
          # của từng file bài viết. Checkout nông (mặc định fetch-depth: 1) chỉ
          # có một commit nên mọi file sẽ trả về cùng một ngày.
          fetch-depth: 0

      - name: Chuẩn bị Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Phải chạy TRƯỚC cap-nhat-so-can.mjs: trang tòa vừa sinh ra cũng nằm
      # trong phạm vi mà script kia quét, chạy sau thì trang mới phải đợi tới
      # hôm sau mới được rà số căn và ngày cập nhật.
      - name: Sinh trang theo tòa
        run: |
          set -o pipefail
          python3 scripts/sinh-trang-toa.py ${{ inputs.chi_thu && '--thu' || '' }} \
            2>&1 | tee ket-qua.txt

      # Phải chạy TRƯỚC cap-nhat-so-can.mjs: script kia đếm lại từ data.json
      # rồi ghi numberOfItems/itemListElement của ItemList, nên thân trang phải
      # đúng trước đã. Chạy sau thì ItemList mô tả cái lưới của lần chạy
      # trước — đúng kiểu lệch mà bước này sinh ra để dẹp.
      - name: Dựng lại thân trang danh mục
        run: |
          set -o pipefail
          python3 scripts/dung-lai-trang-danh-muc.py ${{ inputs.chi_thu && '--thu' || '' }} \
            2>&1 | tee -a ket-qua.txt

      # Chạy TRƯỚC cap-nhat-so-can.mjs vì script kia đọc index.html để cập nhật
      # tháng trong thẻ SEO. Chạy sau sẽ khiến thẻ SEO mô tả bản trang chủ của
      # lần chạy trước.
      - name: Dựng lại khối tĩnh trang chủ
        run: |
          set -o pipefail
          python3 scripts/dung-lai-trang-chu.py ${{ inputs.chi_thu && '--thu' || '' }} \
            2>&1 | tee -a ket-qua.txt

      # Chạy SAU dung-lai-trang-chu.py và TRƯỚC cap-nhat-so-can.mjs, đúng thứ
      # tự đã chốt: trang căn mới sinh trong lần chạy này cũng được rà ngày
      # cập nhật ngay, không phải đợi tới lần chạy sau.
      - name: Sinh trang riêng cho từng căn hộ
        run: |
          set -o pipefail
          ma=0
          python3 scripts/sinh-trang-can.py ${{ inputs.chi_thu && '--thu' || '' }} \
            2>&1 | tee -a ket-qua.txt || ma=$?
          if [ "$ma" = "2" ]; then
            echo "::warning::sinh-trang-can.py dừng an toàn (mã 2) — các bước sau vẫn chạy."
            exit 0
          fi
          exit "$ma"

      # Chạy SAU sinh-trang-toa.py, dung-lai-trang-danh-muc.py (hai script dựng
      # lại section.luoi, ghi đè liên kết vừa chèn nếu chạy trước) và SAU
      # sinh-trang-can.py (script sinh can-ho/danh-sach-trang.json, bảng tra mà
      # bước này cần để nối tiêu đề thẻ sang đúng trang chi tiết).
      - name: Nối liên kết trang chi tiết vào lưới căn
        run: |
          set -o pipefail
          python3 scripts/noi-lien-ket-chi-tiet.py ${{ inputs.chi_thu && '--thu' || '' }} \
            2>&1 | tee -a ket-qua.txt

      - name: Đếm căn và cập nhật thẻ SEO
        id: chay
        run: |
          set -o pipefail
          node scripts/cap-nhat-so-can.mjs ${{ inputs.chi_thu && '--thu' || '' }} \
            2>&1 | tee -a ket-qua.txt

      - name: Cập nhật lastmod trong sitemap.xml
        run: |
          set -o pipefail
          node scripts/cap-nhat-sitemap.mjs ${{ inputs.chi_thu && '--thu' || '' }} \
            2>&1 | tee -a ket-qua.txt

      - name: Ghi kết quả vào phần tóm tắt của lần chạy
        if: always()
        run: |
          {
            echo "## Kết quả cập nhật thẻ SEO"
            echo
            echo '```'
            cat ket-qua.txt 2>/dev/null || echo "(script không chạy được)"
            echo '```'
            echo
            echo "### Thẻ SEO sau khi sửa"
            echo
            echo '| Trang | `<title>` | `meta description` |'
            echo '| --- | --- | --- |'
            for f in $(grep -rl 'bo-loc-trang' --include='*.html' . | sort); do
              t=$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' "$f" | head -1)
              d=$(sed -n 's:.*<meta name="description" content="\([^"]*\)".*:\1:p' "$f" | head -1)
              echo "| ${f#./} | ${t} | ${d} |"
            done
            echo
            echo '**Trang chủ:** '"$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' index.html | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Xem thay đổi
        if: always()
        run: git --no-pager diff --stat

      - name: Commit và push nếu thực sự có thay đổi
        if: ${{ !inputs.chi_thu }}
        env:
          NHANH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # RÀNG BUỘC: data.json do Apps Script đẩy lên, workflow này không bao
          # giờ được ghi đè. Script không sửa file đó, nhưng vẫn dựng thêm một
          # lớp chặn ở đây cho chắc.
          git checkout -- data.json || true

          # Thư mục trang tòa do sinh-trang-toa.py dựng lại mỗi lần chạy nên
          # phải nằm trong danh sách add. Đưa lên trước phần kiểm tra thay đổi
          # vì `git diff` không nhìn thấy file chưa được theo dõi: tòa mới sinh
          # lần đầu sẽ bị coi là "không có gì thay đổi" và không bao giờ được
          # commit.
          git add -- '*.html' sitemap.xml s4-01-vinhomes-smart-city \
            can-ho sitemap-can-ho.xml

          if git diff --cached --quiet; then
            echo "Không có gì thay đổi — bỏ qua commit, không tạo commit rác."
            exit 0
          fi

          git commit -m "Tự động cập nhật số căn, tháng trong thẻ SEO và lastmod sitemap"

          # Apps Script có thể vừa push data.json lên trong lúc job đang chạy,
          # nên rebase trước khi push. Thử lại vài lần nếu mạng/đụng độ.
          for lan in 1 2 3 4; do
            if git pull --rebase origin "$NHANH" && git push origin "HEAD:$NHANH"; then
              echo "Đã push thành công."
              exit 0
            fi
            cho=$((2 ** lan))
            echo "Push thất bại, thử lại sau ${cho}s..."
            sleep "$cho"
          done
          echo "Không push được sau 4 lần thử."
          exit 1