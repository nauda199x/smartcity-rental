name: Đồng bộ quỹ căn từ Sheet CTV

on:
  pull_request:
    paths:
      - "scripts/dong-bo-ctv.mjs"
      - "dong-bo-can.js"
      - "index.html"
      - "scripts/dung-lai-trang-chu.py"
      - "scripts/test-sola-park-filter.cjs"
      - "scripts/test-ma-can-thu-thao.cjs"
      - "scripts/test-independent-ctv-sync.cjs"
      - "scripts/test-ma-can-thu-thao.py"
      - "scripts/ma_can_hien_thi.py"
      - "scripts/sinh-trang-toa.py"
      - "scripts/sinh-trang-can.py"
      - "scripts/cap-nhat-so-can.mjs"
      - "scripts/sinh-danh-sach-anh.py"
      - ".github/workflows/dong-bo-ctv.yml"
  push:
    branches:
      - main
    paths:
      - "data.json"
      - "scripts/dong-bo-ctv.mjs"
      - "scripts/quet-thu-muc-anh.py"
      - ".github/workflows/dong-bo-ctv.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write

concurrency:
  group: smartcity-ctv-sync
  cancel-in-progress: false

jobs:
  kiem-tra-nguon:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn PR
        uses: actions/checkout@v7
      - name: Chuẩn bị Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Kiểm tra cú pháp và đối soát 2 bảng hàng (không ghi data.json)
        env:
          REQUIRE_THAO: "1"
          REQUIRE_CTV: "1"
        run: |
          node --check scripts/dong-bo-ctv.mjs
          node --check dong-bo-can.js
          node scripts/test-sola-park-filter.cjs
          node scripts/test-ma-can-thu-thao.cjs
          node scripts/test-independent-ctv-sync.cjs
          node --check scripts/cap-nhat-so-can.mjs
          python3 -m py_compile scripts/sinh-danh-sach-anh.py scripts/dung-lai-trang-chu.py scripts/sinh-trang-toa.py scripts/sinh-trang-can.py scripts/ma_can_hien_thi.py
          python3 scripts/test-ma-can-thu-thao.py
          node scripts/dong-bo-ctv.mjs --thu

  dong-bo:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'push' || github.actor != 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Chuẩn bị Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Đồng bộ CTV và đẩy data.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for lan in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            node scripts/dong-bo-ctv.mjs
            git add data.json

            if git diff --cached --quiet; then
              echo "data.json đã khớp Sheet CTV — không cần commit."
              # GITHUB_TOKEN và Apps Script không đảm bảo Pages tự build.
              # Khi workflow vừa được chỉnh hoặc chạy thủ công, yêu cầu Pages
              # phục vụ snapshot main hiện tại dù data.json đã khớp.
              if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
              fi
              exit 0
            fi

            git commit -m "Tự động đồng bộ quỹ căn từ Sheet CTV"
            if git push origin HEAD:main; then
              echo "Đã cập nhật data.json từ Sheet CTV."
              # GITHUB_TOKEN push không tự kích hoạt GitHub Pages.
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
              # GITHUB_TOKEN push khong kich hoat workflow push khac.
              # workflow_dispatch duoc GitHub cho phep: dung HTML chi tiet ngay
              # sau khi gia, tinh trang can ho trong data.json thay doi.
              gh workflow run cap-nhat-so-can.yml --ref main
              echo "Đã yêu cầu sinh lại HTML chi tiết theo data.json mới."
              exit 0
            fi

            cho=$((2 ** lan))
            echo "Main vừa thay đổi trong lúc đồng bộ; thử lại sau ${cho}s..."
            sleep "$cho"
          done

          echo "::error::Không push được data.json sau 4 lần thử."
          exit 1
