name: Đồng bộ quỹ căn từ Sheet CTV

on:
  push:
    branches:
      - main
    paths:
      - "data.json"
      - "scripts/dong-bo-ctv.mjs"
      - "scripts/quet-thu-muc-anh.py"
      - ".github/workflows/dong-bo-ctv.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartcity-ctv-sync
  cancel-in-progress: false

jobs:
  dong-bo:
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Chuẩn bị Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Đồng bộ CTV và đẩy data.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for lan in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            node scripts/dong-bo-ctv.mjs
            git add data.json

            if git diff --cached --quiet; then
              echo "data.json đã khớp Sheet CTV — không cần commit."
              exit 0
            fi

            git commit -m "Tự động đồng bộ quỹ căn từ Sheet CTV"
            if git push origin HEAD:main; then
              echo "Đã cập nhật data.json từ Sheet CTV."
              exit 0
            fi

            cho=$((2 ** lan))
            echo "Main vừa thay đổi trong lúc đồng bộ; thử lại sau ${cho}s..."
            sleep "$cho"
          done

          echo "::error::Không push được data.json sau 4 lần thử."
          exit 1
