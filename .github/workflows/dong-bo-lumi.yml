name: Đồng bộ quỹ căn Lumi Hanoi

on:
  push:
    branches:
      - main
    paths:
      - "data-lumi.json"
      - "lumi-hanoi/**"
      - "assets/lumi-hanoi.js"
      - "assets/lumi-hanoi.css"
      - "assets/project-switch.css"
      - "scripts/dong-bo-lumi.mjs"
      - "scripts/quet-thu-muc-anh-lumi.py"
      - "scripts/sinh-trang-can-lumi.py"
      - ".github/workflows/dong-bo-lumi.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: lumi-rental-sync
  cancel-in-progress: false

jobs:
  dong-bo:
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Chuẩn bị Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Chuẩn bị Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Đồng bộ dữ liệu public từ Google Sheet Lumi
        run: node scripts/dong-bo-lumi.mjs

      - name: Quét thư mục ảnh Drive của căn Lumi
        run: python3 -u scripts/quet-thu-muc-anh-lumi.py

      - name: Sinh trang chi tiết và sitemap Lumi
        run: python3 scripts/sinh-trang-can-lumi.py

      - name: Kiểm tra không lộ mã căn thật hoặc cột nội bộ
        run: |
          python3 - <<'PY'
          import json,re
          data=json.load(open("data-lumi.json",encoding="utf-8"))
          allowed={
            "Mã nội bộ","Mã căn","Tòa","Loại","Diện tích","Nội thất","Giá thuê",
            "Hướng ban công","Ngày vào ở","Ngày cập nhật","Ngày thêm vào hệ thống",
            "Ảnh thư mục","Ảnh đại diện","Danh sách ảnh","Hiển thị trên Web"
          }
          code_re=re.compile(r"^thue(?:1N|2N|3N|Duplex|Penthouse|Shop)\.\d+$")
          for i,row in enumerate(data):
              extra=set(row)-allowed
              if extra:
                  raise SystemExit(f"Dòng {i} có cột không được public: {sorted(extra)}")
              if not code_re.fullmatch(str(row.get("Mã căn",""))):
                  raise SystemExit(f"Dòng {i} có mã public sai chuẩn: {row.get('Mã căn')!r}")
              if row.get("Mã nội bộ") != row.get("Mã căn"):
                  raise SystemExit(f"Dòng {i}: Mã nội bộ phải trùng mã public")
          raw_unit_re=re.compile(r"\b(?:S[1-6]|P[12]|E[12])\.\d{4}\b",re.I)
          from pathlib import Path
          public_files=[Path("data-lumi.json"),Path("sitemap-lumi.xml")]
          public_files += list(Path("lumi-hanoi/can-ho").rglob("*.html"))
          public_files += [Path("lumi-hanoi/can-ho/danh-sach-trang.json")]
          leaked=[]
          for path in public_files:
              if path.exists() and raw_unit_re.search(path.read_text(encoding="utf-8",errors="ignore")):
                  leaked.append(str(path))
          if leaked:
              raise SystemExit("Phát hiện mã căn thật trong output public: "+", ".join(leaked[:10]))
          print(f"OK: {len(data)} dòng chỉ chứa mã public theo STT; output không có mã căn thật/cột nội bộ.")
          PY

      - name: Commit và push kết quả
        id: save
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data-lumi.json lumi-hanoi sitemap-lumi.xml

          if git diff --cached --quiet; then
            echo "Quỹ căn Lumi đã khớp nguồn — không cần commit."
            exit 0
          fi

          git commit -m "Tự động đồng bộ quỹ căn Lumi Hanoi"

          for lan in 1 2 3 4; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Main thay đổi xung đột; dừng để không ghi đè dữ liệu mới."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Đã push dữ liệu Lumi lên main."
              exit 0
            fi
            cho=$((2 ** lan))
            echo "Push thất bại; thử lại sau ${cho}s..."
            sleep "$cho"
          done

          echo "::error::Không push được sau 4 lần thử."
          exit 1

      - name: Cập nhật website
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
