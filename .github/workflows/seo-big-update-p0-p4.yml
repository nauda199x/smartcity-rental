name: SEO Big Update P0-P8

on:
  push:
    branches:
      - main
    paths:
      - "scripts/mo-rong-trang-toa.py"
      - "scripts/seo-p0-p4.py"
      - "scripts/noi-hub-toa.py"
      - "scripts/noi-hub-programmatic.py"
      - "scripts/kiem-tra-mat-bang-toa.py"
      - "scripts/dedupe-tieu-de-can.py"
      - "scripts/toi-uu-chat-luong-can.py"
      - "scripts/tang-suc-manh-internal-link.py"
      - "scripts/uu-tien-crawl-index.py"
      - "scripts/toi-uu-landing-chinh.py"
      - "scripts/kiem-tra-lien-ket.py"
      - ".github/workflows/seo-big-update-p0-p4.yml"
      - "robots.txt"
  pull_request:
    paths:
      - "scripts/mo-rong-trang-toa.py"
      - "scripts/seo-p0-p4.py"
      - "scripts/noi-hub-toa.py"
      - "scripts/noi-hub-programmatic.py"
      - "scripts/kiem-tra-mat-bang-toa.py"
      - "scripts/dedupe-tieu-de-can.py"
      - "scripts/toi-uu-chat-luong-can.py"
      - "scripts/tang-suc-manh-internal-link.py"
      - "scripts/uu-tien-crawl-index.py"
      - "scripts/toi-uu-landing-chinh.py"
      - "scripts/kiem-tra-lien-ket.py"
      - ".github/workflows/seo-big-update-p0-p4.yml"
      - "robots.txt"
  workflow_run:
    workflows:
      - "Cập nhật số căn và tháng trong thẻ SEO"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-p0-p8-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  seo-p0-p8:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy đúng snapshot cần kiểm tra
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Mở rộng landing SEO theo tòa
        run: |
          set -o pipefail
          python3 scripts/mo-rong-trang-toa.py 2>&1 | tee seo-p0-p8.log

      - name: Nối URL căn chi tiết vào các landing tòa mới
        run: |
          set -o pipefail
          python3 scripts/noi-lien-ket-chi-tiet.py 2>&1 | tee -a seo-p0-p8.log

      - name: Dựng lại internal-link graph sau khi có tòa mới
        run: |
          set -o pipefail
          python3 scripts/cap-nhat-lien-ket-noi-bo.py 2>&1 | tee -a seo-p0-p8.log

      - name: P0-P4 crawl guard, entity schema và unique context
        run: |
          set -o pipefail
          python3 scripts/seo-p0-p4.py 2>&1 | tee -a seo-p0-p8.log

      - name: Chặn gắn nhầm mặt bằng giữa các tòa
        run: |
          set -o pipefail
          python3 scripts/kiem-tra-mat-bang-toa.py 2>&1 | tee -a seo-p0-p8.log

      - name: Nối tower hub vào các phân khu và hub căn hộ
        run: |
          set -o pipefail
          python3 scripts/noi-hub-toa.py 2>&1 | tee -a seo-p0-p8.log

      - name: Nối các landing programmatic indexable khỏi orphan
        run: |
          set -o pipefail
          python3 scripts/noi-hub-programmatic.py 2>&1 | tee -a seo-p0-p8.log

      - name: Làm unique title cho các căn bị trùng
        run: |
          set -o pipefail
          python3 scripts/dedupe-tieu-de-can.py 2>&1 | tee -a seo-p0-p8.log

      - name: P5 tăng độ khác biệt từng trang căn
        run: |
          set -o pipefail
          python3 scripts/toi-uu-chat-luong-can.py 2>&1 | tee -a seo-p0-p8.log

      - name: P6 tăng sức mạnh internal-link theo cụm
        run: |
          set -o pipefail
          python3 scripts/tang-suc-manh-internal-link.py 2>&1 | tee -a seo-p0-p8.log

      - name: P7 ưu tiên crawl và index money pages
        run: |
          set -o pipefail
          python3 scripts/uu-tien-crawl-index.py 2>&1 | tee -a seo-p0-p8.log

      - name: P8 tăng độ rõ search intent landing chính
        run: |
          set -o pipefail
          python3 scripts/toi-uu-landing-chinh.py 2>&1 | tee -a seo-p0-p8.log

      - name: Đồng bộ tên site và ảnh ưu tiên
        run: |
          set -o pipefail
          python3 scripts/dong-bo-ten-site.py 2>&1 | tee -a seo-p0-p8.log
          python3 scripts/toi-uu-anh-tim-kiem.py 2>&1 | tee -a seo-p0-p8.log

      - name: Audit P0-P8 lần cuối
        run: |
          set -o pipefail
          python3 scripts/seo-p0-p4.py --kiem-tra 2>&1 | tee -a seo-p0-p8.log
          python3 scripts/audit-indexability-can-ho.py 2>&1 | tee -a seo-p0-p8.log
          python3 scripts/kiem-tra-lien-ket.py 2>&1 | tee -a seo-p0-p8.log
          python3 scripts/uu-tien-crawl-index.py --kiem-tra 2>&1 | tee -a seo-p0-p8.log
          python3 scripts/toi-uu-landing-chinh.py --kiem-tra 2>&1 | tee -a seo-p0-p8.log

      - name: Tóm tắt thay đổi
        if: always()
        run: |
          {
            echo "## SEO Big Update P0-P8"
            echo
            echo '```'
            tail -n 320 seo-p0-p8.log 2>/dev/null || true
            echo '```'
            echo
            echo "### Diff"
            echo '```'
            git --no-pager diff --stat || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit và push thay đổi sinh tự động
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -- data.json || true
          git add -u
          git add -- '*.html' sitemap-toa.xml seo-toa.json bao-cao-seo-p0-p4.json seo-index-priority.json \
            sitemap.xml sitemap-images.xml sitemap-can-ho.xml sitemap-phan-khu-loai-can.xml \
            sitemap-ngan-sach-loai-can.xml 2>/dev/null || true
          git reset -- data.json 2>/dev/null || true

          echo "Trạng thái trước commit:"
          git status --short

          if git diff --cached --quiet; then
            echo "Không có thay đổi sinh tự động — bỏ qua commit."
            exit 0
          fi

          git commit -m "SEO P0-P8: strengthen main rental landing intent"

          if ! git diff --quiet; then
            echo "::error::Vẫn còn tracked change chưa stage sau commit:"
            git status --short
            exit 1
          fi

          for lan in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Đã push SEO P0-P8 lên main."
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((2 ** lan))
          done
          echo "Không push được sau 4 lần thử."
          exit 1