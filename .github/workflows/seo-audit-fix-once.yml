name: SEO audit fixes 2026-09-12

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-audit-fix-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartcity-generated-main
  cancel-in-progress: false

jobs:
  fix-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Patch SEO generators
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Phân khu × loại căn: Imperia đã có "Smart City" trong label,
          # trong khi template lại nối thêm "Smart City" -> title/H1 bị lặp.
          p = Path("scripts/sinh-trang-giao-thoa.py")
          s = p.read_text(encoding="utf-8")
          old = '"Imperia": {"slug": "imperia", "label": "Imperia Smart City", "parent": "/imperia/"},'
          new = '"Imperia": {"slug": "imperia", "label": "Imperia", "parent": "/imperia/"},'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Không tìm thấy cấu hình Imperia cần vá")
          p.write_text(s, encoding="utf-8")

          # 2) Trang tòa: bổ sung ItemList JSON-LD từ đúng danh sách căn đang
          # hiển thị. Chỉ dùng dữ liệu sẵn có, không tạo nội dung suy diễn.
          p = Path("scripts/sinh-trang-toa.py")
          s = p.read_text(encoding="utf-8")

          helper = '''\n\ndef dung_item_list_schema(cac_can, ten):\n    """ItemList JSON-LD cho đúng các căn đang xuất hiện trên trang tòa."""\n    items = []\n    for i, can in enumerate(cac_can, 1):\n        loai = str(can.get("Loại", "")).strip()\n        toa = str(can.get("Tòa", "")).strip()\n        dt = round(dien_tich(can.get("Diện tích")))\n        gia = dinh_dang_gia(so_tien(can.get("Giá thuê")))\n        items.append({\n            "@type": "ListItem",\n            "position": i,\n            "name": "%s %s%s – %s/tháng" % (\n                loai, toa, " %dm²" % dt if dt else "", gia),\n        })\n    return json.dumps({\n        "@context": "https://schema.org",\n        "@type": "ItemList",\n        "name": "Căn hộ đang cho thuê tại tòa %s Vinhomes Smart City" % ten,\n        "numberOfItems": len(cac_can),\n        "itemListElement": items,\n    }, ensure_ascii=False)\n'''
          marker = "\ndef dung_trang(toa, cau_hinh, cac_can, tk, map_anh, hom_nay):"
          if "def dung_item_list_schema(" not in s:
              if marker not in s:
                  raise SystemExit("Không tìm thấy vị trí chèn ItemList helper")
              s = s.replace(marker, helper + marker, 1)

          old = '    }, ensure_ascii=False)\n\n    return ("""<!doctype html>'
          new = '    }, ensure_ascii=False)\n    danh_sach_can_schema = dung_item_list_schema(cac_can, ten)\n\n    return ("""<!doctype html>'
          if "danh_sach_can_schema = dung_item_list_schema(cac_can, ten)" not in s:
              if old not in s:
                  raise SystemExit("Không tìm thấy vị trí tạo schema trang tòa")
              s = s.replace(old, new, 1)

          old = '<script type="application/ld+json">%(duong_dan_bua)s</script>'
          new = old + '\n<script type="application/ld+json">%(danh_sach_can_schema)s</script>'
          if '%(danh_sach_can_schema)s' not in s:
              if old not in s:
                  raise SystemExit("Không tìm thấy thẻ Breadcrumb JSON-LD")
              s = s.replace(old, new, 1)

          old = '        "duong_dan_bua": duong_dan_bua,\n'
          new = old + '        "danh_sach_can_schema": danh_sach_can_schema,\n'
          if '"danh_sach_can_schema": danh_sach_can_schema' not in s:
              if old not in s:
                  raise SystemExit("Không tìm thấy mapping template trang tòa")
              s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Regenerate affected SEO pages
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sinh-trang-toa.py
          python3 scripts/sinh-trang-giao-thoa.py
          python3 scripts/dung-lai-trang-danh-muc.py
          python3 scripts/sinh-trang-can.py
          python3 scripts/noi-lien-ket-chi-tiet.py
          python3 scripts/cap-nhat-lien-ket-noi-bo.py
          node scripts/cap-nhat-so-can.mjs
          python3 scripts/toi-uu-anh-tim-kiem.py
          node scripts/cap-nhat-sitemap.mjs

      - name: SEO regression checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --include='*.html' --exclude-dir=.git --exclude-dir=node_modules 'Smart City Smart City' .; then
            echo 'LỖI: vẫn còn title/H1 lặp Smart City' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = []
          for p in Path('.').glob('*/index.html'):
              txt = p.read_text(encoding='utf-8', errors='ignore')
              if 'Trang này do scripts/sinh-trang-toa.py sinh lại' in txt:
                  files.append(p)
                  if '"@type": "ItemList"' not in txt and '"@type":"ItemList"' not in txt:
                      raise SystemExit(f'Thiếu ItemList: {p}')
          if not files:
              raise SystemExit('Không tìm thấy trang tòa để kiểm tra')
          print(f'OK: {len(files)} trang tòa được kiểm tra có ItemList')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/seo-audit-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi để commit."
            exit 0
          fi
          git commit -m "fix: apply SEO audit template fixes"
          git push origin HEAD:main
